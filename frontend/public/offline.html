<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00613C">
  <title>Flexit — կապ չկա</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #111827; padding: 16px; box-sizing: border-box; }
    .card { max-width: 360px; width: 100%; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 28px 24px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    img { width: 64px; height: 64px; border-radius: 14px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #00613C; color: #fff; border: 0; border-radius: 10px; padding: 12px 20px;
      font-size: 16px; font-weight: 600; width: 100%; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Flexit">
    <h1>Ինտերնետ կապ չկա</h1>
    <p>Ստուգեք Wi-Fi-ը կամ բջջային ինտերնետը և փորձեք նորից։</p>
    <button onclick="location.reload()">Փորձել նորից</button>
  </div>
</body>
</html>
